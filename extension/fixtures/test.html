<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>gmail.js extraction harness</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 4px; white-space: pre-wrap; }
    h1 { font-size: 16px; }
  </style>
</head>
<body>
  <h1>Extraction result</h1>
  <pre id="out">Loading fixture...</pre>
  <script src="../gmail.js"></script>
  <script>
    (async () => {
      const out = document.getElementById("out");
      try {
        const html = await fetch("thread.html").then((r) => r.text());
        const doc = new DOMParser().parseFromString(html, "text/html");
        const result = window.extractGmailThread(doc);
        out.textContent = JSON.stringify(result, null, 2);
      } catch (e) {
        out.textContent = "Error: " + (e?.message ?? e);
      }
    })();
  </script>
</body>
</html>
