<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>formdetect.js extraction harness</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 4px; white-space: pre-wrap; }
    h1 { font-size: 16px; }
    iframe { display: none; }
  </style>
</head>
<body>
  <h1>Detection result</h1>
  <pre id="out">Loading fixture...</pre>
  <iframe id="frame" src="form.html"></iframe>
  <script src="../formdetect.js"></script>
  <script>
    const out = document.getElementById("out");
    const frame = document.getElementById("frame");
    frame.addEventListener("load", () => {
      try {
        // Run detection inside the iframe's document to exercise the
        // scoped-scan path, same idea as the gmail fixture harness.
        const fields = window.detectFormFields(frame.contentDocument);
        out.textContent = JSON.stringify(fields, null, 2);
      } catch (e) {
        out.textContent = "Error: " + (e?.message ?? e);
      }
    });
  </script>
</body>
</html>
